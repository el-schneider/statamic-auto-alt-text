name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: CI – PHP ${{ matrix.php }} / Prism ${{ matrix.prism }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: ['8.3', '8.4']
        prism: ['^0.99', '^0.100']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-prism${{ matrix.prism }}

      # Pin the Prism minor under test so the declared range is proven at both ends.
      - name: Select Prism version
        run: composer require "prism-php/prism:${{ matrix.prism }}" --no-update --no-interaction

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Build assets
        run: npm run build

      - name: Run Pest tests
        run: ./vendor/bin/pest --ci
