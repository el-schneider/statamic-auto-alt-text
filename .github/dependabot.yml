version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '00:30'
      timezone: Europe/Berlin
    # The GitHub Actions ecosystem supports only default-days; a SemVer-bump
    # cooldown key here invalidates the whole file and stops all version updates.
    cooldown:
      default-days: 7
      include:
        - '*'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
      time: '01:30'
      timezone: Europe/Berlin
    # This addon is a library: widen constraints to keep both the old and new
    # release installable rather than replacing the supported range.
    versioning-strategy: widen
    cooldown:
      default-days: 7
      semver-patch-days: 3
      include:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '02:00'
      timezone: Europe/Berlin
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-patch-days: 3
      include:
        - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
